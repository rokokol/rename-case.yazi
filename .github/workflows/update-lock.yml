name: update-lock

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency: update-lock

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      branch: ${{ steps.push.outputs.branch }}
      moved: ${{ steps.push.outputs.moved }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - id: push
        run: |
          nix flake update
          if git diff --quiet -- flake.lock; then
            echo "moved=0" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch=bump/$(date -u +%Y-%m-%d)
          git switch -c "$branch"
          git add flake.lock
          git commit -m "update flake inputs"
          git push origin "$branch"
          echo "branch=$branch" >>"$GITHUB_OUTPUT"
          echo "moved=1" >>"$GITHUB_OUTPUT"

  verify:
    needs: bump
    if: needs.bump.outputs.moved == '1'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.bump.outputs.branch }}

  land:
    needs: [bump, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.branch }}
          fetch-depth: 0
      - env:
          BRANCH: ${{ needs.bump.outputs.branch }}
        run: |
          git push origin "HEAD:$GITHUB_REF_NAME"
          git push origin --delete "$BRANCH"
